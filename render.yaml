# DevMate AI — Render blueprint (free tier) for the API service only.
# The web app (Next.js) deploys to Vercel (free); the database is Supabase.
#
# Usage:
#   1. Create a Supabase project and copy its direct-connection URI + "?sslmode=require".
#   2. Render → New → Blueprint → select this repo. This creates `devmate-api`.
#   3. Add `DATABASE_URL` (Supabase) and `FRONTEND_URL` (the Vercel URL) under
#      Environment on the service, then deploy.

services:
  # ---- API (NestJS) — native Node runtime, no Docker ----
  - type: web
    name: devmate-api
    runtime: node
    repo: https://github.com/skywalkera294-ai/DevMate.ai.git
    branch: main
    plan: free
    buildCommand: >-
      npm ci && npm run build -w @devmate/shared && npm run build -w @devmate/ai
      && npm run build -w @devmate/api && cp apps/api/prisma/schema.postgres.prisma
      apps/api/prisma/schema.prisma && cd apps/api && npx prisma generate
    startCommand: >-
      cd apps/api && npx prisma db push --skip-generate && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://devmate-web.vercel.app
      - key: AI_PROVIDER
        value: offline
      - key: AI_MODEL
        value: gpt-4o-mini
      # DATABASE_URL must be added manually (Supabase connection string).
      # OPENAI_API_KEY / OPENAI_BASE_URL: optional, to enable a real LLM.
